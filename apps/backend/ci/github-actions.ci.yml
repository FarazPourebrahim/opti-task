# OptiTask CI — copy to .github/workflows/ci.yml at the repository root.
# Runs typecheck → lint → test(+coverage) → build on every PR/push, with a
# PostgreSQL service for the integration tests.
#
# This is a pnpm workspace: dependencies install once at the root (which is what
# links @contracts into the backend), then each script runs through --filter.
name: CI

on:
  push:
    branches: [main, dev, 'backend/**']
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: optitask
          POSTGRES_PASSWORD: optitask
          POSTGRES_DB: optitask_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U optitask"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://optitask:optitask@localhost:5432/optitask_test
      JWT_ACCESS_SECRET: ci-access-secret
      JWT_REFRESH_SECRET: ci-refresh-secret
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter optitask-backend run migrate      # prisma migrate deploy against CI DB
      - run: pnpm --filter @contracts run typecheck
      - run: pnpm --filter optitask-backend run typecheck
      - run: pnpm --filter optitask-backend run lint
      - run: pnpm --filter optitask-backend run test:coverage # enforces coverage thresholds
      - run: pnpm --filter optitask-backend run build
