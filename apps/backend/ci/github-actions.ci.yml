# OptiTask CI — copy to .github/workflows/ci.yml at the repository root.
# Runs typecheck → lint → test(+coverage) → build on every PR/push, with a
# PostgreSQL service for the integration tests.
name: CI

on:
  push:
    branches: [main, 'backend/**']
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: optitask
          POSTGRES_PASSWORD: optitask
          POSTGRES_DB: optitask_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U optitask"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://optitask:optitask@localhost:5432/optitask_test
      JWT_ACCESS_SECRET: ci-access-secret
      JWT_REFRESH_SECRET: ci-refresh-secret
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci
      - run: npm run migrate           # prisma migrate deploy against CI DB
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:coverage     # enforces coverage thresholds
      - run: npm run build
